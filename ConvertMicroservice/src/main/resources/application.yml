server:
  port: 0
logging:
  level:
    org:
      springframework:
        web:
          servlet:
            mvc:
              method:
                annotation:
                  SseEmitter: OFF
      apache:
        coyote: OFF
        catalina:
          core:
            ContainerBase: OFF # АЛИЛУЯ, СРАБОТАЛО!!!!!!!!!!!!!!!!
          connector:
            OutputBuffer: OFF
        tomcat:
          util:
            net=OFF: # октлючаем логи у всех этих, т.к. они печатаются в консоль каждый раз,
            # когда юзер разрывает SSE соединение (бесит)
eureka:
  instance:
    hostname: localhost
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
spring:
  application:
    name: convert
  kafka:
    consumer:
      bootstrap-servers: localhost:9092
      group-id: files
      auto-offset-reset: latest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      bootstrap-servers: localhost:9092
      properties:
        enable:
          idempotence: 'true'
  freemarker:
    expose-request-attributes: 'true'
  messages:
    encoding: UTF-8
  datasource:
    password: '89534536403'
    username: postgres
    url: jdbc:postgresql://localhost:5432/postgres
  jpa:
    hibernate:
      ddl-auto: update
  http:
    client:
      read-timeout: 35m # таймаут 35 минут для генерации ответа
  ai:
    ollama:
      embedding:
        options:
          model: qwen3-embedding:8b
          truncate: false
          max-tokens: 32768
      chat:
        model: saiga:latest
      base-url: 'http://localhost:11434'
    embedding:
      chunk:
        max-size: 512
        pretty-metadata: false # требует ключи document_path и/или title иначе fallback
      transformer:
        onnx:
          model-uri: file:multilingual\model.onnx
        tokenizer:
          uri: file:multilingual\tokenizer.json
          options:
            maxLength: 512 # ограничение multilingual-e5-large
            modelMaxLength: 512 # ограничение multilingual-e5-large
main:
  mount-point: C:\ # точка, от которой будет браться относительный путь от смонтированной шары, т.к.
  # SMB понимает только отн. путь
  ad: # Active Directory
    user:
      auth-file: credentials.txt # Не распространять! Логин и пароль пользователя для active directory электрона
      netbios-name: electronhelper
    server:
      domain: 'elektron.spb.su'
      share: 'dfs-root'
      netbios-domain: 'ELEKTRON'

  image-filter: true
  make-chunk-summary: false
  file:
    folder-watcher-type: 'POLLING' # MONITORING or POLLING
    full-folder-indexing: true
    full-folder-indexing-by-kafka: true
    convert-to-text: true
    root:
      path: C:\test, C:\test2 # Можно указывать массив из директорий через ","
      except: C:\test3 # Можно указывать массив из директорий через ","
    image-root: 'C:\image'
    pdf-root : 'C:\pdf'