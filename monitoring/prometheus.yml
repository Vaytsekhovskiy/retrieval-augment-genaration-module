global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: spring-services
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - bot-microservice:9090
          - convert-microservice:9090
          - main-microservice:9090
          - api-gateway:9090
          - discovery-server:9090
